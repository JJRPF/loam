# Deploy a pull request from the owner to https://loamstaging.thepfisters.com (web) and the Pi's staging API
# (https://core-node.tailcd5892.ts.net:8443). Opened, reopened or new commits: deploy. Closed or merged: if staging is
# still showing this PR, put it back on main. Latest deploy wins.
#
# Only PRs from a branch of this repository by the owner deploy: a fork's PR never runs these jobs, and secrets are
# only available to the jobs that name `environment: staging`.
name: Staging

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: loam-staging
  cancel-in-progress: false

env:
  STAGING_URL: https://loamstaging.thepfisters.com
  STAGING_API: https://core-node.tailcd5892.ts.net:8443
  FIREBASE_PROJECT: thepfisters

jobs:
  tests:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'JJRPF'
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}

  deploy:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment:
      name: staging
      url: https://loamstaging.thepfisters.com
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build the web app (staging) before anything is deployed
        env:
          WEB_ENV: staging
          HOSTING_TARGET: staging
          BUILD_ONLY: "1"
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_PROJECT_ID: thepfisters
        run: scripts/deploy-web.sh
      - name: Join the tailnet (tag:ci, ephemeral)
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Deploy the PR head to the staging API
        env:
          LOAM_DEPLOY_SSH_KEY: ${{ secrets.LOAM_DEPLOY_SSH_KEY }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REF: ${{ github.event.pull_request.head.ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          meta=$(scripts/deploy/ci/meta.sh)
          scripts/deploy/ci/pi-gate.sh stage "$PR" "$SHA" "$meta"
      - name: Check the staging API
        run: |
          curl -fsS --retry 5 --retry-delay 3 "$STAGING_API/health" | grep -q '"status":"ok"'
          curl -fsSI "$STAGING_API/api/config" | grep -qi '^x-robots-tag: noindex'
      - name: Authenticate to Google (keyless)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - name: Deploy the web app to Firebase Hosting (staging site only)
        env:
          WEB_ENV: staging
          HOSTING_TARGET: staging
          SKIP_BUILD: "1"
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
        run: scripts/deploy-web.sh
      - name: Check the staging site
        run: |
          curl -fsS --retry 5 --retry-delay 3 "$STAGING_URL/" | grep -q 'id="root"'
          curl -fsSI "$STAGING_URL/" | grep -qi '^x-robots-tag: noindex'
          curl -fsS "$STAGING_URL/robots.txt" | grep -q 'Disallow: /'
      - name: Comment on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/deploy/ci/pr-comment.sh deployed

  reset:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'JJRPF'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment:
      name: staging
      url: https://loamstaging.thepfisters.com
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Join the tailnet (tag:ci, ephemeral)
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Does staging still show this PR?
        id: showing
        env:
          LOAM_DEPLOY_SSH_KEY: ${{ secrets.LOAM_DEPLOY_SSH_KEY }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          showing=$(scripts/deploy/ci/pi-gate.sh status | sed -n 's/^staging: //p' | jq -r '.pr // empty')
          if [ "$showing" = "$PR" ]; then echo "reset=true" >> "$GITHUB_OUTPUT"; else echo "reset=false" >> "$GITHUB_OUTPUT"; fi
      - name: Put the staging API back on main
        if: steps.showing.outputs.reset == 'true'
        env:
          LOAM_DEPLOY_SSH_KEY: ${{ secrets.LOAM_DEPLOY_SSH_KEY }}
          ACTOR: ${{ github.actor }}
          REF: main
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          scripts/deploy/ci/pi-gate.sh stage-main "$(scripts/deploy/ci/meta.sh)"
      - name: Authenticate to Google (keyless)
        if: steps.showing.outputs.reset == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - name: Put the staging site back on main's build
        if: steps.showing.outputs.reset == 'true'
        env:
          WEB_ENV: staging
          HOSTING_TARGET: staging
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_PROJECT_ID: thepfisters
        run: scripts/deploy-web.sh
      - name: Comment on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RESET: ${{ steps.showing.outputs.reset }}
        run: scripts/deploy/ci/pr-comment.sh "$( [ "$RESET" = true ] && echo reset || echo left-alone )"
