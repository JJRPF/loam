# GraphHopper config used by docker-compose.yml: copy to $DATA_DIR/graphhopper/config.yml. Paths are inside the container ($DATA_DIR is mounted at /data).
graphhopper:
  datareader.file: /data/osm/new-hampshire-latest.osm.pbf
  graph.location: /data/graphhopper/graph-cache
  import.osm.ignored_highways: ""

  graph.encoded_values: >-
    car_access, car_average_speed,
    bike_priority, bike_access, bike_average_speed, bike_road_access,
    mtb_priority, mtb_access, mtb_average_speed, mtb_rating,
    foot_access, foot_priority, foot_average_speed, foot_road_access,
    hike_rating, roundabout, road_class, surface, track_type, smoothness, country, osm_way_id

  profiles:
    - name: mtb
      custom_model_files: [mtb.json]
    - name: bike
      custom_model_files: [bike.json]
    - name: foot
      custom_model_files: [foot.json]

  profiles_ch: []
  profiles_lm: []

  prepare.min_network_size: 200
  prepare.subnetworks.threads: 1

server:
  application_connectors:
  - type: http
    port: 8989
    bind_host: 0.0.0.0
  request_log:
    appenders: []
  admin_connectors:
  - type: http
    port: 8990
    bind_host: 127.0.0.1

logging:
  appenders:
    - type: console
      time_zone: UTC
      log_format: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
